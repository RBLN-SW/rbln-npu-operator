# Multi-driver example: per-family versions plus a canary group.
# Apply with: helm install rbln-npu-operator . -f sample-values-MultiDriver.yaml
# Values omitted here inherit from values.yaml.
# rebellions.ai/npu.family labels are applied automatically by the
# operator-managed NodeFeatureRule; env is any user-applied label.
# The effective pull path for each instance is family-scoped
# (.../atom/rbln-driver, .../rebel100/rbln-driver), derived automatically
# from the node's family label -- not the flat repository path above.
driver:
  enabled: true
  deployDefault: false        # every NPU node is explicitly grouped below
  image:
    registry: repo.rebellions.ai
    repository: rebellions/rbln-driver
    tag: "3.5.1"              # inherited default for instances without a tag
  imagePullSecrets:
  - drivercred
  instances:
    atom:
      image:
        tag: "3.4.1"
      nodeSelector:
        rebellions.ai/npu.family: atom
    atom-canary:
      image:
        # Starts at the release version; replace with a published candidate
        # when testing an upgrade on nodes labeled env=canary.
        tag: "3.4.1"
      nodeSelector:
        rebellions.ai/npu.family: atom
        env: canary
    rebel100:
      image:
        tag: "3.5.1"
      nodeSelector:
        rebellions.ai/npu.family: rebel100
