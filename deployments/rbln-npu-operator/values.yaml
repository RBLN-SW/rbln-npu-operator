# Default values for rbln-npu-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Override chart name for resource naming (keeps names short despite chart rename)
nameOverride: rbln-npu-operator

# Workload type: "container" (default) or "vm-passthrough".
workloadType: container

# Node Feature Discovery dependency
nfd:
  enabled: false

# Keep the CRDs in sync on `helm upgrade` (Helm applies crds/ only on first
# install and never upgrades them). Set false if a GitOps tool reconciles crds/.
crds:
  upgrade:
    enabled: true
    imagePullSecrets: []
    tolerations: []
    resources: {}
    # crd-apply hook Job logging. The hook runs pre-install, before the
    # operator exists, so cluster-level logging configuration cannot reach it.
    logging:
      level: info        # error|warning|info|debug
      format: json       # json|text

# RDS (Rebellions Direct Storage): NPU direct NVMe access. When enabled, the
# operator deploys a dedicated driver pool (RBLN_RDS_BINDING=enabled) onto nodes
# the admin labels rebellions.ai/rds.present=true. Binding formats the node's
# spare NVMe, so only label such nodes.
rds:
  enabled: false
  # deviceSelection restricts, per node, which NVMe PCI devices RDS binds
  # (TARGET_BDFS allowlist). Omit → each rds.present node uses the bind
  # script's default auto opt-out. BDFs are node-specific PCI addresses.
  # deviceSelection:
  #   - nodeName: npu-worker01
  #     targetBDFs:
  #       - "0000:d8:00.0"

# Common defaults applied to all managed DaemonSet pods.
podDefaults:
  labels: {}
  annotations: {}
  tolerations: []
  # Example: allow scheduling on control-plane nodes
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  priorityClassName: ""

# Operator configuration
operator:
  # Operator image configuration
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator
    tag: ""  # Defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  # Resource configuration
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  logging:
    # zap gate for the operator manager's own logs. Redirected client-go/klog
    # records surface at V(0) only; raising their verbosity needs a klog -v
    # container arg AND this level raised to match.
    # NOTE: invalid values crash the operator at startup (unlike
    # crds.upgrade.logging, which falls back).
    # error|info|debug|panic or an integer N>0 (logr V<=N)
    level: info
    encoder: json      # json|console
    timeEncoding: rfc3339nano  # epoch|millis|nanos|iso8601|rfc3339|rfc3339nano
    develMode: false  # true = zap development behavior: DPanic panics + full Kubernetes-object dumps in log values; encoder/level are unaffected — set them explicitly above
  # Operator self-metrics. HTTPS + authn/authz — scrapers need a SA token
  # bound to the -metrics-reader ClusterRole.
  metrics:
    enabled: true
    port: 8443
    serviceMonitor:
      # Rendered only when the Prometheus Operator CRD is present. GitOps
      # flows using `helm template` need --api-versions monitoring.coreos.com/v1.
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      additionalLabels: {}
      relabelings: []
  # Verify each composed driver image exists in its registry (manifest HEAD,
  # authenticated with the driver CR's imagePullSecrets) before rendering the
  # pool DaemonSet. Only a 404 fails the pool, with a DriverImageNotFound
  # condition naming the exact missing image instead of a silent
  # ImagePullBackOff; every other outcome (401/403, timeout, TLS or DNS
  # failure) only logs a warning and proceeds, leaving kubelet the final
  # arbiter. Set false to skip the check entirely -- a mirror-only or
  # disconnected cluster, or one where node-level credentials the operator
  # cannot see (ServiceAccount pull secret, kubelet config.json, ECR/GCR
  # instance identity) authenticate the pull.
  driverImageCheck: true
  # Pod security context
  securityContext:
    runAsNonRoot: true

  # Affinity configuration
  # Override these values to control where the operator runs
  # Default: no affinity (can run on any node)
  #
  # Example for control plane nodes:
  # affinity:
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 1
  #       preference:
  #         matchExpressions:
  #         - key: "node-role.kubernetes.io/control-plane"
  #           operator: Exists
  affinity: {}

  # Tolerations configuration
  # Override these values to allow running on tainted nodes
  # Default: no tolerations (only run on untainted nodes)
  #
  # Example for control plane nodes:
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: Exists
  #   effect: NoSchedule
  # - key: "node-role.kubernetes.io/master"
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []

# Driver configuration
driver:
  enabled: false
  # Deploy the default RBLNDriver CR (rbln-driver): the fallback for every NPU
  # node not claimed by an entry in driver.instances. Set false to run only
  # explicitly targeted instances (requires at least one instance).
  deployDefault: true
  # Driver upgrade policy rendered under spec.driver.upgradePolicy.
  # If autoUpgrade is false, the remaining options are ignored.
  upgradePolicy:
    autoUpgrade: false
    maxParallelUpgrades: 1
    waitForCompletion:
      timeoutSeconds: 0
      podSelector: ""
    npuPodDeletion:
      force: false
      timeoutSeconds: 300
    drain:
      enable: false
      force: false
      deleteEmptyDirData: false
      podSelector: ""
      timeoutSeconds: 300
    reboot:
      enable: false
      rebootTimeoutSeconds: 0
      image:
        registry: docker.io
        image: rebellions/rbln-node-reboot
        version: v1.0.1
  image:
    registry: repo.rebellions.ai
    repository: rebellions/rbln-driver
    tag: "3.2.2"
    pullPolicy: IfNotPresent
  imagePullSecrets:
  - drivercred
  # Example:
  # imagePullSecrets: []
  # Example:
  # nodeSelector:
  #   rebellions.ai/old: "true"
  nodeSelector: {}
  # Example:
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []
  # Example:
  # annotations:
  #   my-annotation: "true"
  annotations: {}
  # Example:
  # priorityClassName: system-node-critical
  priorityClassName: ""
  # Example:
  # resources:
  #   requests:
  #     cpu: 250m
  #     memory: 64Mi
  #   limits:
  #     cpu: 500m
  #     memory: 128Mi
  resources: {}
  # Example:
  # env:
  # - name: RBLN_DRIVER_LOG_LEVEL
  #   value: info
  env: []
  manager:
    image:
      registry: docker.io
      repository: rebellions/rbln-k8s-driver-manager
      tag: v0.2.2
      pullPolicy: IfNotPresent
  #  imagePullSecrets:
  #  - my-registry-secret
  # rbln-smd node daemon deployed per RBLNDriver CR. No tag: the smd image tag
  # always follows the driver version (driver.image.tag / per-instance tag).
  smd:
    image:
      registry: repo.rebellions.ai
      repository: rebellions/rbln-smd
  # Additional RBLNDriver instances for per-node-group driver versions.
  # Each key becomes a CR named rbln-driver-<key>. Fields not set on an
  # instance inherit from the driver block above (maps deep-merge; LISTS such
  # as tolerations/env/imagePullSecrets REPLACE the inherited value).
  # nodeSelector is never inherited and is required per instance; overlap is
  # resolved by specificity (a selector that is a strict superset wins), and
  # incomparable ties are reported on the CR as ConflictingNodeSelector.
  # Example:
  # instances:
  #   atom-canary:
  #     image:
  #       tag: "3.3.0-rc1"
  #     nodeSelector:
  #       rebellions.ai/npu.family: atom
  #       env: canary
  instances: {}


# NPU Device Plugin configuration
devicePlugin:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/k8s-device-plugin
    tag: v0.4.3
    pullPolicy: IfNotPresent
  # Advertise the generic resource name (rebellions.ai/npu) in addition to product-specific ones.
  # the controller forwards it to the device plugin container as USE_GENERIC_RESOURCE_NAME.
  useGenericResourceName: true
  # OTLP gRPC endpoint (host:port, or a scheme-qualified URL) for device-plugin allocation traces.
  # The controller forwards it to the container as OTEL_EXPORTER_OTLP_ENDPOINT; empty disables tracing.
  otlpEndpoint: ""
  # Operand log gate. Unset (the default) leaves the image's own info/json in
  # place; the controller renders an env var only for the keys you set here.
  # logging:
  #   level: debug     # error|warning|warn|info|debug
  #   format: text     # json|text

# NPU DRA kubelet plugin configuration
draKubeletPlugin:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/k8s-dra-driver-npu
    tag: v0.1.3
    pullPolicy: IfNotPresent
  driverName: npu.rebellions.ai
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  healthcheckPort: 51515
  # See devicePlugin.logging.
  # logging:
  #   level: debug
  #   format: text

# NPU Metrics Exporter configuration
metricsExporter:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-metrics-exporter
    tag: v0.3.4
    pullPolicy: IfNotPresent
  # See devicePlugin.logging.
  # logging:
  #   level: debug
  #   format: text

# NPU Feature Discovery configuration
npuFeatureDiscovery:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-feature-discovery
    tag: v0.2.3
    pullPolicy: IfNotPresent
  # See devicePlugin.logging.
  # logging:
  #   level: debug
  #   format: text

# Container Toolkit configuration
containerToolkit:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-container-toolkit
    tag: v0.2.3
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  # rbln-ctk-daemon refresh interval (Go duration string, e.g. "5s", "1m"). "0s" disables auto-refresh.
  refreshInterval: 5s
  env: []

# Sandbox Device Plugin for VM workloads
sandboxDevicePlugin:
  enabled: false
  # Standalone sandbox-device-plugin binary
  # (github.com/RBLN-SW/sandbox-device-plugin).
  image:
    registry: docker.io
    repository: rebellions/sandbox-device-plugin
    tag: v0.1.1
    pullPolicy: IfNotPresent
  # See devicePlugin.logging.
  # logging:
  #   level: debug
  #   format: text

  # Per-model: empty RBLN_PT_ALIAS → one resource per (model, function),
  # e.g. rebellions.ai/RBLN-CA22_PF. KubeVirt permittedHostDevices must
  # whitelist each name in use.

# VFIO Manager for VM workloads
vfioManager:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/rbln-vfio-manager
    tag: v1.0.1
    pullPolicy: IfNotPresent
  driverManager:
    image:
      registry: docker.io
      repository: rebellions/rbln-k8s-driver-manager
      tag: v0.2.2
      pullPolicy: IfNotPresent
    env: []

# Validator configuration
validator:
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator-validator
    tag: ""  # Defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  env: []
  toolkit:
    env: []
  driver:
    env: []
