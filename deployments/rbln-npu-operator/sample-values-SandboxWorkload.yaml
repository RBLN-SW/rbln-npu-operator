# Default values for rbln-npu-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Workload type: "container" (default) or "vm-passthrough".
workloadType: vm-passthrough

# Node Feature Discovery dependency
nfd:
  enabled: false

# Common defaults applied to all managed DaemonSet pods.
podDefaults:
  labels: {}
  annotations: {}
  tolerations: []
  priorityClassName: ""

# Operator configuration
operator:
  # Operator image configuration
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator
    tag: latest
    pullPolicy: IfNotPresent
  # Resource configuration
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Service configuration
  service:
    type: ClusterIP
    port: 8443
    targetPort: 8443
  # Pod security context
  securityContext:
    runAsNonRoot: true

  # Affinity configuration
  # Override these values to control where the operator runs
  # Default: no affinity (can run on any node)
  #
  # Example for control plane nodes:
  # affinity:
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 1
  #       preference:
  #         matchExpressions:
  #         - key: "node-role.kubernetes.io/control-plane"
  #           operator: Exists
  affinity: {}

  # Tolerations configuration
  # Override these values to allow running on tainted nodes
  # Default: no tolerations (only run on untainted nodes)
  #
  # Example for control plane nodes:
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: Exists
  #   effect: NoSchedule
  # - key: "node-role.kubernetes.io/master"
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []

# Driver configuration
driver:
  enabled: false
  # Driver upgrade policy rendered under spec.driver.upgradePolicy.
  # If autoUpgrade is false, the remaining options are ignored.
  upgradePolicy:
    autoUpgrade: false
    maxParallelUpgrades: 1
    waitForCompletion:
      timeoutSeconds: 0
      podSelector: ""
    npuPodDeletion:
      force: false
      timeoutSeconds: 300
    drain:
      enable: false
      force: false
      deleteEmptyDirData: false
      podSelector: ""
      timeoutSeconds: 300
    reboot:
      enable: false
      rebootTimeoutSeconds: 0
      image:
        registry: docker.io
        image: rebellions/rbln-node-reboot
        version: latest
  image:
    registry: repo.rebellions.ai
    repository: rebellions/rbln-driver
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  # Example:
  # imagePullSecrets:
  # - my-registry-secret
  imagePullSecrets: []
  # Example:
  # nodeSelector:
  #   rebellions.ai/npu.present: "true"
  nodeSelector: {}
  # Example:
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []
  # Example:
  # annotations:
  #   my-annotation: "true"
  annotations: {}
  # Example:
  # priorityClassName: system-node-critical
  priorityClassName: ""
  # Example:
  # resources:
  #   requests:
  #     cpu: 250m
  #     memory: 64Mi
  #   limits:
  #     cpu: 500m
  #     memory: 128Mi
  resources: {}
  # Example:
  # env:
  # - name: RBLN_DRIVER_LOG_LEVEL
  #   value: info
  env: []
  manager:
    image:
      registry: docker.io
      repository: rebellions/rbln-k8s-driver-manager
      tag: v0.1.2
      pullPolicy: IfNotPresent
  #  imagePullSecrets:
  #  - my-registry-secret


# NPU Device Plugin configuration
devicePlugin:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/k8s-device-plugin
    tag: latest
    pullPolicy: IfNotPresent
  resourceList:
  - productCardNames:
    - RBLN-CA12
    - RBLN-CA22
    - RBLN-CA25
    resourceName: ATOM
    resourcePrefix: rebellions.ai
  - productCardNames:
    - RBLN-CR03
    resourceName: REBEL
    resourcePrefix: rebellions.ai

# NPU Metrics Exporter configuration
metricsExporter:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/rbln-metrics-exporter
    tag: latest
    pullPolicy: IfNotPresent

# RBLN Daemon configuration
rblnDaemon:
  enabled: false
  image:
    registry: repo.rebellions.ai
    repository: rebellions/rbln-daemon
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  hostPort: 50051
  imagePullSecrets: []
  resources: {}

  env: []

# NPU Feature Discovery configuration
npuFeatureDiscovery:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-feature-discovery
    tag: latest
    pullPolicy: IfNotPresent

# Container Toolkit configuration
containerToolkit:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/rbln-container-toolkit
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}

  env: []

# Sandbox Device Plugin for VM workloads
sandboxDevicePlugin:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/k8s-device-plugin
    tag: latest
    pullPolicy: IfNotPresent

  # Resource discovery for sandbox workloads
  resourceList:
  - productCardNames:
    - RBLN-CA12
    resourceName: ATOM_PT
    resourcePrefix: rebellions.ai
  - productCardNames:
    - RBLN-CA25
    resourceName: ATOM_MAX_PT
    resourcePrefix: rebellions.ai
  - productCardNames:
    - RBLN-CR03
    resourceName: REBEL_PT
    resourcePrefix: rebellions.ai

# VFIO Manager for VM workloads
vfioManager:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-vfio-manager
    tag: latest
    pullPolicy: IfNotPresent

# Validator configuration
validator:
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator-validator
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}

  env: []
  toolkit:
    env: []
  driver:
    env: []
