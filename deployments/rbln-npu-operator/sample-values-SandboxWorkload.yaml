# Sample values for the VM/sandbox (vm-passthrough) workload deployment of rbln-npu-operator.
# Apply with: helm install rbln-npu-operator . -f sample-values-SandboxWorkload.yaml
# Values omitted here inherit from values.yaml.

# Workload type: "container" (default) or "vm-passthrough".
workloadType: vm-passthrough

# Node Feature Discovery dependency
nfd:
  enabled: false

# Common defaults applied to all managed DaemonSet pods.
podDefaults:
  labels: {}
  annotations: {}
  tolerations: []
  # Example: allow scheduling on control-plane nodes
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  priorityClassName: ""

# Operator configuration
operator:
  # Operator image configuration
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator
    tag: ""  # Defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  # Resource configuration
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Operator manager logging (zap flags). See values.yaml for semantics.
  logging:
    level: info
    encoder: json
    timeEncoding: rfc3339nano
    develMode: false
  # Operator self-metrics (HTTPS + authn/authz). See values.yaml.
  metrics:
    enabled: true
    port: 8443
    serviceMonitor:
      enabled: false
  # Pod security context
  securityContext:
    runAsNonRoot: true

  # Affinity configuration
  # Override these values to control where the operator runs
  # Default: no affinity (can run on any node)
  #
  # Example for control plane nodes:
  # affinity:
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 1
  #       preference:
  #         matchExpressions:
  #         - key: "node-role.kubernetes.io/control-plane"
  #           operator: Exists
  affinity: {}

  # Tolerations configuration
  # Override these values to allow running on tainted nodes
  # Default: no tolerations (only run on untainted nodes)
  #
  # Example for control plane nodes:
  # tolerations:
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: Exists
  #   effect: NoSchedule
  # - key: "node-role.kubernetes.io/master"
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []

# Driver configuration
driver:
  enabled: false
  # Driver upgrade policy rendered under spec.driver.upgradePolicy.
  # If autoUpgrade is false, the remaining options are ignored.
  upgradePolicy:
    autoUpgrade: false
    maxParallelUpgrades: 1
    waitForCompletion:
      timeoutSeconds: 0
      podSelector: ""
    npuPodDeletion:
      force: false
      timeoutSeconds: 300
    drain:
      enable: false
      force: false
      deleteEmptyDirData: false
      podSelector: ""
      timeoutSeconds: 300
    reboot:
      enable: false
      rebootTimeoutSeconds: 0
      image:
        registry: docker.io
        image: rebellions/rbln-node-reboot
        version: v1.0.1
  image:
    registry: repo.rebellions.ai
    repository: rebellions/rbln-driver
    tag: "3.2.2"
    pullPolicy: IfNotPresent
  imagePullSecrets:
  - drivercred
  # Example:
  # imagePullSecrets: []
  # Example:
  # nodeSelector:
  #   rebellions.ai/old: "true"
  nodeSelector: {}
  # Example:
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  tolerations: []
  # Example:
  # annotations:
  #   my-annotation: "true"
  annotations: {}
  # Example:
  # priorityClassName: system-node-critical
  priorityClassName: ""
  # Example:
  # resources:
  #   requests:
  #     cpu: 250m
  #     memory: 64Mi
  #   limits:
  #     cpu: 500m
  #     memory: 128Mi
  resources: {}
  # Example:
  # env:
  # - name: RBLN_DRIVER_LOG_LEVEL
  #   value: info
  env: []
  manager:
    image:
      registry: docker.io
      repository: rebellions/rbln-k8s-driver-manager
      tag: v0.2.2
      pullPolicy: IfNotPresent
  #  imagePullSecrets:
  #  - my-registry-secret


# NPU Device Plugin configuration
devicePlugin:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/k8s-device-plugin
    tag: v0.4.3
    pullPolicy: IfNotPresent
  # Advertise the generic resource name (rebellions.ai/npu) in addition to product-specific ones.
  # the controller forwards it to the device plugin container as USE_GENERIC_RESOURCE_NAME.
  useGenericResourceName: true

# NPU DRA kubelet plugin configuration
draKubeletPlugin:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/k8s-dra-driver-npu
    tag: v0.1.3
    pullPolicy: IfNotPresent
  driverName: npu.rebellions.ai
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  healthcheckPort: 51515

# NPU Metrics Exporter configuration
metricsExporter:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/rbln-metrics-exporter
    tag: v0.3.4
    pullPolicy: IfNotPresent

# NPU Feature Discovery configuration
npuFeatureDiscovery:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-feature-discovery
    tag: v0.2.3
    pullPolicy: IfNotPresent

# Container Toolkit configuration
containerToolkit:
  enabled: false
  image:
    registry: docker.io
    repository: rebellions/rbln-container-toolkit
    tag: v0.2.3
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  env: []

# Sandbox Device Plugin for VM workloads.
# The image is the standalone sandbox-device-plugin binary
# (github.com/RBLN-SW/sandbox-device-plugin), not the shared k8s-device-plugin
sandboxDevicePlugin:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/sandbox-device-plugin
    tag: v0.1.1
    pullPolicy: IfNotPresent

  # Per-model: empty RBLN_PT_ALIAS → rebellions.ai/RBLN-<MODEL>_{PF,VF}.
  # KubeVirt permittedHostDevices must whitelist each name in use.

# VFIO Manager for VM workloads
vfioManager:
  enabled: true
  image:
    registry: docker.io
    repository: rebellions/rbln-vfio-manager
    tag: v1.0.1
    pullPolicy: IfNotPresent
  driverManager:
    image:
      registry: docker.io
      repository: rebellions/rbln-k8s-driver-manager
      tag: v0.2.2
      pullPolicy: IfNotPresent
    env: []

# Validator configuration
validator:
  image:
    registry: docker.io
    repository: rebellions/rbln-npu-operator-validator
    tag: ""  # Defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources: {}
  env: []
  toolkit:
    env: []
  driver:
    env: []
