apiVersion: rebellions.ai/v1beta1
kind: RBLNClusterPolicy
metadata:
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
  name: rbln-cluster-policy
spec:
  workloadType: {{ .Values.workloadType | quote }}
  {{- $upgradePolicy := .Values.driver.upgradePolicy }}
  driver:
    {{- with $upgradePolicy }}
    {{- $waitForCompletion := default (dict) .waitForCompletion }}
    {{- $npuPodDeletion := default (dict) .npuPodDeletion }}
    {{- $drain := default (dict) .drain }}
    {{- $reboot := default (dict) .reboot }}
    {{- $rebootImage := default (dict) $reboot.image }}
    upgradePolicy:
      autoUpgrade: {{ .autoUpgrade | default false }}
      maxParallelUpgrades: {{ .maxParallelUpgrades | default 1 }}
      waitForCompletion:
        timeoutSeconds: {{ $waitForCompletion.timeoutSeconds | default 0 }}
        {{- if $waitForCompletion.podSelector }}
        podSelector: {{ $waitForCompletion.podSelector | quote }}
        {{- end }}
      podDeletion:
        force: {{ $npuPodDeletion.force | default false }}
        timeoutSeconds: {{ $npuPodDeletion.timeoutSeconds | default 300 }}
      drain:
        enable: {{ $drain.enable | default false }}
        force: {{ $drain.force | default false }}
        deleteEmptyDirData: {{ $drain.deleteEmptyDirData | default false }}
        {{- if $drain.podSelector }}
        podSelector: {{ $drain.podSelector | quote }}
        {{- end }}
        timeoutSeconds: {{ $drain.timeoutSeconds | default 300 }}
      reboot:
        enable: {{ $reboot.enable | default false }}
        rebootTimeoutSeconds: {{ $reboot.rebootTimeoutSeconds | default 0 }}
        image:
          registry: {{ $rebootImage.registry | default "docker.io" | quote }}
          image: {{ $rebootImage.image | default "rebellions/rbln-node-reboot" | quote }}
          version: {{ $rebootImage.version | default "v1.0.0" | quote }}
    {{- end }}
  {{- $pd := .Values.podDefaults }}
  {{- if and $pd (or $pd.labels $pd.annotations $pd.tolerations $pd.priorityClassName) }}
  podDefaults:
    {{- with $pd.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $pd.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $pd.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $pd.priorityClassName }}
    priorityClassName: {{ $pd.priorityClassName | quote }}
    {{- end }}
  {{- end }}
  devicePlugin:
    enabled: {{ .Values.devicePlugin.enabled }}
    registry: {{ .Values.devicePlugin.image.registry | quote }}
    image: {{ .Values.devicePlugin.image.repository | quote }}
    version: {{ .Values.devicePlugin.image.tag | quote }}
    imagePullPolicy: {{ .Values.devicePlugin.image.pullPolicy | quote }}
    useGenericResourceName: {{ .Values.devicePlugin.useGenericResourceName }}

  draKubeletPlugin:
    enabled: {{ .Values.draKubeletPlugin.enabled }}
    registry: {{ .Values.draKubeletPlugin.image.registry | quote }}
    image: {{ .Values.draKubeletPlugin.image.repository | quote }}
    version: {{ .Values.draKubeletPlugin.image.tag | quote }}
    imagePullPolicy: {{ .Values.draKubeletPlugin.image.pullPolicy | quote }}
    driverName: {{ .Values.draKubeletPlugin.driverName | quote }}
    kubeletRegistrarDirectoryPath: {{ .Values.draKubeletPlugin.kubeletRegistrarDirectoryPath | quote }}
    kubeletPluginsDirectoryPath: {{ .Values.draKubeletPlugin.kubeletPluginsDirectoryPath | quote }}
    healthcheckPort: {{ .Values.draKubeletPlugin.healthcheckPort }}

  metricsExporter:
    enabled: {{ .Values.metricsExporter.enabled }}
    registry: {{ .Values.metricsExporter.image.registry | quote }}
    image: {{ .Values.metricsExporter.image.repository | quote }}
    imagePullPolicy: {{ .Values.metricsExporter.image.pullPolicy | quote }}
    version: {{ .Values.metricsExporter.image.tag | quote }}

  rblnDaemon:
    enabled: {{ .Values.rblnDaemon.enabled }}
    registry: {{ .Values.rblnDaemon.image.registry | quote }}
    image: {{ .Values.rblnDaemon.image.repository | quote }}
    imagePullPolicy: {{ .Values.rblnDaemon.image.pullPolicy | quote }}
    version: {{ .Values.rblnDaemon.image.tag | quote }}
    hostPort: {{ .Values.rblnDaemon.hostPort }}
    {{- if .Values.rblnDaemon.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml .Values.rblnDaemon.imagePullSecrets | nindent 6 }}
    {{- end }}
    {{- if .Values.rblnDaemon.resources }}
    resources:
      {{- toYaml .Values.rblnDaemon.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.rblnDaemon.env }}
    env:
      {{- toYaml .Values.rblnDaemon.env | nindent 6 }}
    {{- end }}

  npuFeatureDiscovery:
    enabled: {{ .Values.npuFeatureDiscovery.enabled }}
    registry: {{ .Values.npuFeatureDiscovery.image.registry | quote }}
    image: {{ .Values.npuFeatureDiscovery.image.repository | quote }}
    imagePullPolicy: {{ .Values.npuFeatureDiscovery.image.pullPolicy | quote }}
    version: {{ .Values.npuFeatureDiscovery.image.tag | quote }}

  containerToolkit:
    enabled: {{ .Values.containerToolkit.enabled }}
    registry: {{ .Values.containerToolkit.image.registry | quote }}
    image: {{ .Values.containerToolkit.image.repository | quote }}
    imagePullPolicy: {{ .Values.containerToolkit.image.pullPolicy | quote }}
    version: {{ .Values.containerToolkit.image.tag | quote }}
    {{- if .Values.containerToolkit.refreshInterval }}
    refreshInterval: {{ .Values.containerToolkit.refreshInterval | quote }}
    {{- end }}
    {{- if .Values.containerToolkit.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml .Values.containerToolkit.imagePullSecrets | nindent 6 }}
    {{- end }}
    {{- if .Values.containerToolkit.resources }}
    resources:
      {{- toYaml .Values.containerToolkit.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.containerToolkit.env }}
    env:
      {{- toYaml .Values.containerToolkit.env | nindent 6 }}
    {{- end }}

  sandboxDevicePlugin:
    enabled: {{ .Values.sandboxDevicePlugin.enabled }}
    registry: {{ .Values.sandboxDevicePlugin.image.registry | quote }}
    image: {{ .Values.sandboxDevicePlugin.image.repository | quote }}
    imagePullPolicy: {{ .Values.sandboxDevicePlugin.image.pullPolicy | quote }}
    version: {{ .Values.sandboxDevicePlugin.image.tag | quote }}

  vfioManager:
    enabled: {{ .Values.vfioManager.enabled }}
    registry: {{ .Values.vfioManager.image.registry | quote }}
    image: {{ .Values.vfioManager.image.repository | quote }}
    imagePullPolicy: {{ .Values.vfioManager.image.pullPolicy | quote }}
    version: {{ .Values.vfioManager.image.tag | quote }}
    driverManager:
      registry: {{ .Values.vfioManager.driverManager.image.registry | quote }}
      image: {{ .Values.vfioManager.driverManager.image.repository | quote }}
      version: {{ .Values.vfioManager.driverManager.image.tag | quote }}
      imagePullPolicy: {{ .Values.vfioManager.driverManager.image.pullPolicy | quote }}
      {{- with .Values.vfioManager.driverManager.env }}
      env:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  validator:
    registry: {{ .Values.validator.image.registry | quote }}
    image: {{ .Values.validator.image.repository | quote }}
    imagePullPolicy: {{ .Values.validator.image.pullPolicy | quote }}
    version: {{ .Values.validator.image.tag | default .Chart.AppVersion | quote }}
    {{- if .Values.validator.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml .Values.validator.imagePullSecrets | nindent 6 }}
    {{- end }}
    {{- if .Values.validator.resources }}
    resources:
      {{- toYaml .Values.validator.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.validator.env }}
    env:
      {{- toYaml .Values.validator.env | nindent 6 }}
    {{- end }}
    {{- with .Values.validator.toolkit.env }}
    toolkit:
      env:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.validator.driver.env }}
    driver:
      env:
        {{- toYaml . | nindent 8 }}
    {{- end }}
