{{- if .Values.crds.upgrade.enabled }}
{{- /*
Helm applies crds/ only on first install and never upgrades them; this hook
re-applies them on upgrade. server-side apply is required — the RBLNClusterPolicy
CRD exceeds the 256Ki client-side last-applied-configuration annotation limit.
*/}}
{{- $name := printf "%s-crd-upgrade" (include "rbln-npu-operator.fullname" .) }}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-upgrade
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-upgrade
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "0"
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-upgrade
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-upgrade
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "0"
data:
  {{- /* A ConfigMap is capped at 1Mi; split per-CRD if crds/ outgrows it. */}}
{{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbln-npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: crd-upgrade
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "rbln-npu-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crd-upgrade
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      {{- with .Values.crds.upgrade.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crds.upgrade.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crd-upgrade
          image: {{ default "registry.k8s.io" .Values.crds.upgrade.image.registry }}/{{ .Values.crds.upgrade.image.repository }}:{{ .Values.crds.upgrade.image.tag }}
          imagePullPolicy: {{ .Values.crds.upgrade.image.pullPolicy }}
          command:
            - kubectl
          args:
            - apply
            - --server-side
            - --force-conflicts
            - -f
            - /etc/rbln-crds
          env:
            # kubectl caches discovery under $HOME; point it at a writable path.
            - name: HOME
              value: /tmp
          {{- with .Values.crds.upgrade.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crds
              mountPath: /etc/rbln-crds
              readOnly: true
      volumes:
        - name: crds
          configMap:
            name: {{ $name }}
{{- end }}
