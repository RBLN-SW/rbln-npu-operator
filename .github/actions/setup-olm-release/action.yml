name: Set up OLM release runner
description: Install the build tools and authenticate to the artifact destination.
inputs:
  registry:
    description: Registry host/project
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-go
    - shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        if ! command -v docker >/dev/null; then
          curl -fsSL https://get.docker.com | sudo sh
          sudo apt-get update && sudo apt-get install -y acl
          sudo setfacl -m "u:$(id -un):rw" /var/run/docker.sock
        fi
        if ! command -v make >/dev/null || ! command -v jq >/dev/null || ! command -v gh >/dev/null; then
          sudo apt-get update && sudo apt-get install -y make jq gh
        fi
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        regctl_version=$(awk -F'= *' '/^REGCTL_VERSION /{print $2}' versions.mk)
        curl -fsSL "https://github.com/regclient/regclient/releases/download/$regctl_version/regctl-linux-amd64" -o "$HOME/.local/bin/regctl"
        curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "$HOME/.local/bin/yq"
        chmod +x "$HOME/.local/bin/"{regctl,yq}
        echo "OLM_REGISTRY_HOST=${REGISTRY%%/*}" >> "$GITHUB_ENV"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.OLM_REGISTRY_HOST }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
