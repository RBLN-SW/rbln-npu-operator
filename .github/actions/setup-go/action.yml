name: "Setup Go from versions.mk"
description: "Parse Go version from versions.mk and setup Go with caching"

runs:
  using: "composite"
  steps:
    - name: Read Go version
      id: versions
      shell: bash
      run: |
        GOLANG_VERSION=$(grep '^GOLANG_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ?')
        echo "golang-version=${GOLANG_VERSION}" >> $GITHUB_OUTPUT
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.versions.outputs.golang-version }}
        cache: true
