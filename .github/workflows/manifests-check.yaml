name: Manifests Checks

on:
  workflow_call:

jobs:
  # Check manifests
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: azure/setup-helm@v4
        name: Setup Helm
      - name: Run helm lint
        run: helm lint deployments/rbln-npu-operator
      - name: Template chart with sample values
        run: |
          helm repo add nfd https://kubernetes-sigs.github.io/node-feature-discovery/charts --force-update
          helm dependency build deployments/rbln-npu-operator
          for f in deployments/rbln-npu-operator/sample-values-*.yaml; do
            helm template ci deployments/rbln-npu-operator -f "$f" > /dev/null
          done
          helm template ci deployments/rbln-npu-operator --set operator.driverImageCheck=false > /dev/null
          # Configured family instances are legal while disabled; no driver
          # CR may be rendered until the master switch is enabled.
          for custom_instance in false true; do
            args=(--set driver.enabled=false)
            if [ "$custom_instance" = true ]; then
              args+=(--set driver.instances.a.nodeSelector.family=atom)
            fi
            rendered=$(helm template ci deployments/rbln-npu-operator "${args[@]}")
            if grep -q '^kind: RBLNDriver$' <<< "$rendered"; then
              echo "driver.enabled=false rendered a driver CR" >&2
              exit 1
            fi
          done
          rendered=$(helm template ci deployments/rbln-npu-operator --set driver.enabled=true --set driver.deployDefault=false)
          test "$(grep -c '^kind: RBLNDriver$' <<< "$rendered")" -eq 2
          grep -q '^  name: rbln-driver-atom$' <<< "$rendered"
          grep -q '^  name: rbln-driver-rebel100$' <<< "$rendered"
          # driver.instances guardrails: every combination below is a
          # violation and must fail to render. A plain `! helm template ...`
          # cannot gate this: bash errexit exempts !-inverted commands, so a
          # removed guardrail would render fine and the step would still pass.
          must_fail() {
            if helm template ci deployments/rbln-npu-operator "$@" > /dev/null 2>&1; then
              echo "guardrail missing: helm template unexpectedly succeeded with: $*" >&2
              exit 1
            fi
          }
          must_fail --set driver.enabled=true --set driver.instances.a.image.tag=x
          must_fail --set driver.enabled=true --set driver.deployDefault=false --set driver.instances=null
          must_fail --set driver.enabled=true --set 'driver.instances.a.nodeSelector.rebellions\.ai/npu\.driver\.owner=x'
          must_fail --set driver.enabled=true --set 'driver.nodeSelector.rebellions\.ai/npu\.deploy\.driver=true'
          must_fail --set driver.enabled=true --set driver.instances.a.nodeSelector.family=atom --set driver.instances.a.bogus=x
          must_fail --set driver.enabled=true --set driver.instances.Bad.nodeSelector.family=atom
          must_fail --set driver.enabled=true --set driver.instances.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.nodeSelector.family=atom
