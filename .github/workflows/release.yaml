name: release

# Publish from a version tag: vX.Y.Z-rcN -> Harbor, vX.Y.Z -> docker.io by
# digest. Tags are created by cut-release / tag-release only.
#
# The `release` job is the release kit's reusable workflow: it classifies the
# tag, builds the operator and validator images and the chart for an rc, and
# for a GA promotes the newest rc by digest, re-packages the chart, drafts the
# release notes and deletes the backport label. The jobs after it are what only
# the operator needs:
#
#   rc   OLM pre-validation and the rc catalog image, the component digests
#        pinned at the rc (the GA bundle reuses them), Red Hat preflight, and
#        the test-infra matrix validation that posts the `rc-validation` commit
#        status the kit reads before a GA is published.
#   GA   the certified-operators bundle PR (merge: true) with the digests
#        pinned at the rc.
#
# The kit's own Slack summary is off (notify: false); rc-notify / ga-notify
# below report the whole run in one message.
# Everything else lives in the release kit: https://github.com/RBLN-SW/cloud-component-release-kit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write # GA deletes the "backport release-X.Y.Z" label
  statuses: read # GA reads the rc-validation commit status

env:
  HARBOR_REGISTRY: ${{ vars.CLOUD_COMPONENT_HARBOR_REGISTRY }}
  DOCKERHUB_REGISTRY: ${{ vars.CLOUD_COMPONENT_DOCKERHUB_REGISTRY }}
  # The OCP range the bundle claims lives in versions.mk (OCP_RANGE); the jobs
  # that need it read it from there so there is exactly one place to bump.

jobs:
  release:
    uses: RBLN-SW/cloud-component-release-kit/.github/workflows/release.yaml@v1
    with:
      images: rbln-npu-operator rbln-npu-operator-validator
      release_name: RBLN NPU Operator
      chart_dir: deployments/rbln-npu-operator
      chart_repos: nfd=https://kubernetes-sigs.github.io/node-feature-discovery/charts
      # The rc chart resolves operator and validator from Harbor. Component
      # images stay on docker.io at their GA tags: the rc validation exercises
      # that exact combination, and rc-digests pins it for the GA bundle.
      chart_rc_values: '.operator.image.registry = env(HARBOR_HOST) | .validator.image.registry = env(HARBOR_HOST)'
      release_notes_extra: hack/release/component-table.sh
      notify: false
    secrets: inherit

  # ---------------------------------------------------------------- rc path --
  #
  # Harbor and obedients are reachable only from the in-network runner
  # rbln-sw-k8s-general; every rc job that pulls, pushes or calls into the
  # network runs there.

  rc-olm-check:
    name: rc OLM pre-validation
    needs: release
    if: needs.release.outputs.kind == 'rc'
    runs-on: rbln-sw-k8s-general
    steps:
      - uses: actions/checkout@v4
      - name: Derive the Harbor host
        run: echo "HARBOR_HOST=${HARBOR_REGISTRY%%/*}" >> "$GITHUB_ENV"
      # Every job lands on a fresh runner: make (bundle, catalog, operator-sdk)
      # and docker (catalog image) have to be installed here.
      - name: Install prerequisites
        run: |
          if ! command -v docker &>/dev/null; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
            sudo chmod 666 /var/run/docker.sock
          fi
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi
      - uses: ./.github/actions/setup-go
      - name: Install yq
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/yq"
      - name: Read the OCP range from versions.mk
        run: echo "OCP_RANGE=$(grep '^OCP_RANGE' versions.mk | cut -d'=' -f2 | tr -d ' ?')" >> "$GITHUB_ENV"
      - name: Generate bundle against the rc image
        run: |
          make bundle VERSION="$GITHUB_REF_NAME" \
            IMAGE="$HARBOR_REGISTRY/rbln-npu-operator:$GITHUB_REF_NAME" USE_IMAGE_DIGESTS=false
          yq -i '.annotations."com.redhat.openshift.versions" = env(OCP_RANGE)' bundle/metadata/annotations.yaml
      - name: Bundle validate (optional suites the Red Hat pipeline also runs)
        run: |
          make operator-sdk
          ./bin/operator-sdk bundle validate ./bundle --select-optional suite=operatorframework
          ./bin/operator-sdk bundle validate ./bundle --select-optional name=operatorhub
      - name: Render and validate a single-bundle FBC catalog
        run: make catalog VERSION="$GITHUB_REF_NAME" CATALOG_BUNDLE=bundle
      - name: Upgrade-graph check against upstream certified-operators
        run: hack/release/olm-graph-check.sh "${{ needs.release.outputs.version }}"
      # The rc validation installs the operator through OLM on OpenShift from
      # this catalog image, so the certified-operators PR is not the first place
      # the bundle meets a real cluster.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push the rc catalog image
        run: |
          make catalog-build-image VERSION="$GITHUB_REF_NAME" REGISTRY="$HARBOR_REGISTRY" \
            PLATFORM=linux/amd64 PUSH_ON_BUILD=true
          echo "catalog: $HARBOR_REGISTRY/rbln-npu-operator-catalog:$GITHUB_REF_NAME"

  # Pin the component images the chart names, by digest, at the rc, and attach
  # the file to the kit's pre-release (assets do not expire like workflow
  # artifacts do). GA reuses it for the OLM bundle instead of resolving the
  # (mutable) tags again, so the bundle ships exactly the combination the rc
  # validation exercised.
  rc-digests:
    name: rc component digests
    needs: release
    if: needs.release.outputs.kind == 'rc'
    runs-on: rbln-sw-k8s-general
    steps:
      - uses: actions/checkout@v4
      - name: Derive the Harbor host
        run: echo "HARBOR_HOST=${HARBOR_REGISTRY%%/*}" >> "$GITHUB_ENV"
      - name: Install regctl and yq
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          REGCTL_VERSION=$(grep '^REGCTL_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ?')
          curl -sSL "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" \
            -o "$HOME/.local/bin/regctl"
          curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$HOME/.local/bin/yq"
          chmod +x "$HOME/.local/bin/regctl" "$HOME/.local/bin/yq"
      - name: Registry logins
        run: |
          regctl registry login "$HARBOR_HOST" -u "${{ secrets.HARBOR_USERNAME }}" -p "${{ secrets.HARBOR_PASSWORD }}"
          regctl registry login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_PASSWORD }}"
      - name: Resolve digests
        env:
          VALUES_FILE: deployments/rbln-npu-operator/values.yaml
        run: |
          set -euo pipefail
          # resolve <key> <yq path>
          resolve() {
            local key=$1 path=$2 image
            image="$(yq "${path}.registry" "$VALUES_FILE")/$(yq "${path}.repository" "$VALUES_FILE"):$(yq "${path}.tag" "$VALUES_FILE")"
            echo "$key=$image@$(regctl image digest "$image")"
          }
          mkdir -p digests
          {
            echo "OPERATOR=$HARBOR_REGISTRY/rbln-npu-operator:$GITHUB_REF_NAME@$(regctl image digest "$HARBOR_REGISTRY/rbln-npu-operator:$GITHUB_REF_NAME")"
            echo "VALIDATOR=$HARBOR_REGISTRY/rbln-npu-operator-validator:$GITHUB_REF_NAME@$(regctl image digest "$HARBOR_REGISTRY/rbln-npu-operator-validator:$GITHUB_REF_NAME")"
            resolve DEVICE_PLUGIN .devicePlugin.image
            resolve METRICS_EXPORTER .metricsExporter.image
            resolve NPU_FEATURE_DISCOVERY .npuFeatureDiscovery.image
            resolve VFIO_MANAGER .vfioManager.image
            resolve CONTAINER_TOOLKIT .containerToolkit.image
            resolve DRA_KUBELET_PLUGIN .draKubeletPlugin.image
            resolve SANDBOX_DEVICE_PLUGIN .sandboxDevicePlugin.image
            resolve DRIVER_MANAGER .driver.manager.image
          } > digests/component-digests.env
          cat digests/component-digests.env
      # The kit created the pre-release for this tag before this job started
      # (needs: release); only the asset is added here.
      - name: Attach the digests to the rc pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: digests/component-digests.env
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Red Hat container certification checks on the exact rc images. Warn-only
  # until PREFLIGHT_ENFORCE=true is set as a repository variable.
  rc-preflight:
    name: rc preflight (container)
    needs: release
    if: needs.release.outputs.kind == 'rc'
    runs-on: rbln-sw-k8s-general
    continue-on-error: ${{ vars.PREFLIGHT_ENFORCE != 'true' }}
    steps:
      - name: Derive the Harbor host
        run: echo "HARBOR_HOST=${HARBOR_REGISTRY%%/*}" >> "$GITHUB_ENV"
      - name: Install preflight
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          V=$(curl -sSL https://api.github.com/repos/redhat-openshift-ecosystem/openshift-preflight/releases/latest | jq -r .tag_name)
          curl -sSL -o "$HOME/.local/bin/preflight" \
            "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${V}/preflight-linux-amd64"
          chmod +x "$HOME/.local/bin/preflight"
          "$HOME/.local/bin/preflight" version
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: preflight check container
        run: |
          set -euo pipefail
          for img in rbln-npu-operator rbln-npu-operator-validator; do
            echo "== $img"
            preflight check container "$HARBOR_REGISTRY/$img:$GITHUB_REF_NAME" \
              --docker-config "$HOME/.docker/config.json" --artifacts "artifacts/$img"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ github.ref_name }}
          path: artifacts/

  # Hand the rc to the test-infra matrix pipeline once every artifact it
  # installs (chart, images, catalog) is on Harbor. The verdict comes back as
  # the `rc-validation` commit status on the rc commit, which the kit reads
  # before a GA is published. One validation per rc; a newer rc cancels the
  # validation of the older one.
  rc-validate:
    name: rc validation (test-infra matrix)
    needs: [release, rc-olm-check]
    runs-on: rbln-sw-k8s-general
    outputs:
      build_url: ${{ steps.trigger.outputs.build_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Trigger the validation build
        id: trigger
        env:
          # Preferred: the pipeline's webhook trigger URL (no API token on the
          # GitHub side; obedients applies the body's env). The API token path
          # is optional and additionally lets the script cancel the previous
          # rc's validation.
          BUILDKITE_TRIGGER_URL: ${{ secrets.OBEDIENTS_VALIDATE_TRIGGER_URL }}
          BUILDKITE_API_TOKEN: ${{ secrets.OBEDIENTS_API_TOKEN }}
          BUILDKITE_API_URL: ${{ vars.BUILDKITE_API_URL }}
          BUILDKITE_ORG: ${{ vars.BUILDKITE_ORG }}
          BUILDKITE_VALIDATE_PIPELINE: ${{ vars.BUILDKITE_VALIDATE_PIPELINE }}
          BUILDKITE_VALIDATE_BRANCH: ${{ vars.BUILDKITE_VALIDATE_BRANCH }}
          SENTINEL_REF: ${{ vars.RC_VALIDATION_SENTINEL_REF }}
        run: hack/release/validate-rc.sh "$GITHUB_REF_NAME"

  # Gated on the tag name, not on the kit's outputs: a failure inside the kit
  # must still be reported here, and the outputs may be empty then.
  rc-notify:
    name: rc summary -> Slack
    needs: [release, rc-olm-check, rc-digests, rc-preflight, rc-validate]
    if: always() && contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release kit (slack-notify.sh)
        uses: actions/checkout@v4
        with:
          repository: RBLN-SW/cloud-component-release-kit
          ref: v1
          path: .release-kit
      - env:
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CLOUD_COMPONENT_SLACK_CHANNEL_ID }}
          R_KIT: ${{ needs.release.result }}
          R_OLM: ${{ needs.rc-olm-check.result }}
          R_DIG: ${{ needs.rc-digests.result }}
          R_PRE: ${{ needs.rc-preflight.result }}
          R_VAL: ${{ needs.rc-validate.result }}
          BUILD_URL: ${{ needs.rc-validate.outputs.build_url }}
        run: |
          mark() { case "$1" in success) echo ":white_check_mark:";; failure) echo ":x:";; cancelled) echo ":no_entry_sign:";; skipped) echo ":fast_forward:";; *) echo ":grey_question:";; esac; }
          color=good
          for r in "$R_KIT" "$R_OLM" "$R_DIG" "$R_VAL"; do
            case $r in failure|cancelled) color=danger;; esac
          done
          pre="$(mark "$R_PRE") Preflight (Red Hat certification)"
          if [ "$R_PRE" = failure ]; then pre=":warning: Preflight found issues (warn-only, see run)"; [ "$color" = good ] && color=warning; fi
          branch="release-${GITHUB_REF_NAME#v}"; branch=${branch%-rc*}
          rows="$(mark "$R_KIT") Images amd64 + arm64 → \`$HARBOR_REGISTRY\`, Helm chart \`${GITHUB_REF_NAME#v}\` → Harbor OCI, GitHub pre-release
          $(mark "$R_OLM") OLM pre-validation, upgrade graph, catalog image
          $(mark "$R_DIG") Component digests pinned
          $pre
          $(mark "$R_VAL") Matrix validation triggered
          _Verdict lands as the \`rc-validation\` status on the rc commit; GA waits for it._"
          links=(--link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME|pre-release")
          [ -n "$BUILD_URL" ] && links+=(--link "$BUILD_URL|validation build")
          .release-kit/scripts/slack-notify.sh --color "$color" "${links[@]}" --details "$rows" \
            --title ":test_tube: *${GITHUB_REPOSITORY#*/}* · *$GITHUB_REF_NAME* · release candidate on \`$branch\`" ""

  # ---------------------------------------------------------------- GA path --

  olm-bundle:
    name: GA OLM bundle PR (certified-operators)
    needs: release
    if: needs.release.outputs.kind == 'ga'
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - name: Read the OCP range from versions.mk
        run: echo "OCP_RANGE=$(grep '^OCP_RANGE' versions.mk | cut -d'=' -f2 | tr -d ' ?')" >> "$GITHUB_ENV"
      # Operator and validator digests come from the kit's promotion (copied by
      # digest from the rc). Component digests were pinned when the rc was
      # published (rc-digests) and travel on the rc pre-release. Resolving the
      # tags again here could pick up an image re-pushed since the validation.
      - name: Component digests pinned at the validated rc
        id: digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_RC: ${{ needs.release.outputs.last_rc }}
          TAG: ${{ github.ref_name }}
          PROMOTED: ${{ needs.release.outputs.digests }}
        run: |
          set -euo pipefail
          digest_of() { awk -F= -v k="$1" '$1 == k { print $2 }' <<<"$PROMOTED"; }
          operator_digest=$(digest_of rbln-npu-operator)
          validator_digest=$(digest_of rbln-npu-operator-validator)
          [ -n "$operator_digest" ] && [ -n "$validator_digest" ] ||
            { echo "::error::operator/validator digests missing from the kit's outputs: '$PROMOTED'"; exit 1; }
          gh release download "$LAST_RC" --pattern component-digests.env --dir digests
          # shellcheck disable=SC1091
          . digests/component-digests.env
          {
            echo "operator=$DOCKERHUB_REGISTRY/rbln-npu-operator:$TAG@$operator_digest"
            echo "validator=$DOCKERHUB_REGISTRY/rbln-npu-operator-validator:$TAG@$validator_digest"
            echo "device_plugin=$DEVICE_PLUGIN"
            echo "metrics_exporter=$METRICS_EXPORTER"
            echo "npu_feature_discovery=$NPU_FEATURE_DISCOVERY"
            echo "vfio_manager=$VFIO_MANAGER"
            echo "container_toolkit=$CONTAINER_TOOLKIT"
            echo "dra_kubelet_plugin=$DRA_KUBELET_PLUGIN"
            echo "sandbox_device_plugin=$SANDBOX_DEVICE_PLUGIN"
            echo "driver_manager=$DRIVER_MANAGER"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Update image digests in manager config
        env:
          OPERATOR_DIGEST: ${{ steps.digests.outputs.operator }}
          VALIDATOR_DIGEST: ${{ steps.digests.outputs.validator }}
          DEVICE_PLUGIN_DIGEST: ${{ steps.digests.outputs.device_plugin }}
          METRICS_EXPORTER_DIGEST: ${{ steps.digests.outputs.metrics_exporter }}
          NPU_FEATURE_DISCOVERY_DIGEST: ${{ steps.digests.outputs.npu_feature_discovery }}
          VFIO_MANAGER_DIGEST: ${{ steps.digests.outputs.vfio_manager }}
          CONTAINER_TOOLKIT_DIGEST: ${{ steps.digests.outputs.container_toolkit }}
          DRA_KUBELET_PLUGIN_DIGEST: ${{ steps.digests.outputs.dra_kubelet_plugin }}
          SANDBOX_DEVICE_PLUGIN_DIGEST: ${{ steps.digests.outputs.sandbox_device_plugin }}
          DRIVER_MANAGER_DIGEST: ${{ steps.digests.outputs.driver_manager }}
        run: |
          FILE=config/manager/manager.yaml
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_OPERATOR")).value = env(OPERATOR_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_OPERATOR_VALIDATOR")).value = env(VALIDATOR_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_K8S_DEVICE_PLUGIN")).value = env(DEVICE_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_METRICS_EXPORTER")).value = env(METRICS_EXPORTER_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_FEATURE_DISCOVERY")).value = env(NPU_FEATURE_DISCOVERY_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_VFIO_MANAGER")).value = env(VFIO_MANAGER_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_CONTAINER_TOOLKIT")).value = env(CONTAINER_TOOLKIT_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_DRA_KUBELET_PLUGIN")).value = env(DRA_KUBELET_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_SANDBOX_DEVICE_PLUGIN")).value = env(SANDBOX_DEVICE_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_DRIVER_MANAGER")).value = env(DRIVER_MANAGER_DIGEST)' "$FILE"
      - name: Generate bundle
        env:
          TAG: ${{ github.ref_name }}
          OPERATOR_DIGEST: ${{ steps.digests.outputs.operator }}
        run: make bundle VERSION="${TAG}" IMAGE="${OPERATOR_DIGEST}"
      - name: Patch bundle annotations
        run: |
          yq -i '.annotations."com.redhat.openshift.versions" = env(OCP_RANGE)' \
            bundle/metadata/annotations.yaml
      - name: Patch CSV containerImage
        env:
          OPERATOR_DIGEST: ${{ steps.digests.outputs.operator }}
        run: |
          yq -i '.metadata.annotations.containerImage = env(OPERATOR_DIGEST)' \
            bundle/manifests/rbln-npu-operator.clusterserviceversion.yaml
      - name: Validate bundle
        run: make operator-sdk && ./bin/operator-sdk bundle validate ./bundle
      - name: Create PR to certified-operators
        id: pr
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.CERTIFIED_OPERATORS_PAT }}
          FORK: ${{ secrets.CERTIFIED_OPERATORS_FORK }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          BRANCH="pr/rbln-npu-operator/${VERSION}"

          # Clone fork
          gh repo clone "${FORK}" /tmp/certified-operators
          cd /tmp/certified-operators

          # Refuse to overwrite an existing fork branch (fail-fast on rerun)
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "ERROR: branch ${BRANCH} already exists on fork — clean it up before retrying." >&2
            exit 1
          fi

          # Sync fork with upstream (gh clone automatically sets upstream remote for forks)
          git fetch upstream main
          git checkout -b "${BRANCH}" upstream/main

          # Same graph check the rc path ran, now against upstream main as it is
          # at this moment: the PR must become the single head of every channel.
          "$GITHUB_WORKSPACE/hack/release/olm-graph-check.sh" "${VERSION}" /tmp/certified-operators

          # Copy bundle files
          DEST="operators/rbln-npu-operator/${VERSION}"
          if [ -d "${DEST}" ]; then
            echo "ERROR: ${DEST} already exists upstream — refusing to overwrite. Bump tag and retry." >&2
            exit 1
          fi
          mkdir -p "${DEST}/manifests" "${DEST}/metadata" "${DEST}/tests"
          cp "$GITHUB_WORKSPACE/bundle/manifests/rbln-npu-operator.clusterserviceversion.yaml" "${DEST}/manifests/"
          cp "$GITHUB_WORKSPACE/bundle/manifests/rebellions.ai_rblnclusterpolicies.yaml" "${DEST}/manifests/"
          cp "$GITHUB_WORKSPACE/bundle/manifests/rebellions.ai_rblndrivers.yaml" "${DEST}/manifests/"
          cp "$GITHUB_WORKSPACE/bundle/metadata/annotations.yaml" "${DEST}/metadata/"
          cp -r "$GITHUB_WORKSPACE/bundle/tests/scorecard" "${DEST}/tests/"

          OCP_RANGE=$(yq '.annotations."com.redhat.openshift.versions"' "${DEST}/metadata/annotations.yaml")
          if [[ ! "${OCP_RANGE}" =~ ^v4\.[0-9]+-v4\.[0-9]+$ ]]; then
            echo "ERROR: invalid OCP range '${OCP_RANGE}' (expected vMAJ.MIN-vMAJ.MIN)" >&2
            exit 1
          fi
          OCP_LO="${OCP_RANGE%-*}"
          OCP_HI="${OCP_RANGE#*-}"
          OCP_LO_MINOR="${OCP_LO#v4.}"
          OCP_HI_MINOR="${OCP_HI#v4.}"
          OCP_MINORS=()
          for m in $(seq "${OCP_LO_MINOR}" "${OCP_HI_MINOR}"); do
            OCP_MINORS+=("v4.${m}")
          done
          echo "OCP_MINORS=${OCP_MINORS[*]}"

          {
            echo '---'
            echo 'cert_project_id: 685d049721914f92599b0e27'
            echo 'merge: true'
            echo 'fbc:'
            echo '  enabled: true'
            echo '  catalog_mapping:'
            for ocp in "${OCP_MINORS[@]}"; do
              echo "    - catalog_names: [${ocp}]"
              echo "      template_name: ${ocp}.yaml"
              echo "      type: olm.template.basic"
            done
          } > operators/rbln-npu-operator/ci.yaml

          mkdir -p operators/rbln-npu-operator/catalog-templates
          declare -A PREV_PER_OCP
          NEW_TEMPLATES=()
          for ocp in "${OCP_MINORS[@]}"; do
            TPL="operators/rbln-npu-operator/catalog-templates/${ocp}.yaml"
            if [ -f "$TPL" ]; then
              HEAD=$(yq '.entries[] | select(.schema=="olm.channel" and .name=="stable") | .entries[].name' "$TPL" \
                     | grep '^rbln-npu-operator\.v' | sort -V | tail -1 || true)
              if [ -n "$HEAD" ] && [ "$HEAD" != "null" ]; then
                PREV_PER_OCP[$ocp]="$HEAD"
              fi
              echo "PREV_PER_OCP[$ocp]=${PREV_PER_OCP[$ocp]:-<existing template, no entries>}"
            else
              cat > "$TPL" <<SKELETON
          ---
          schema: olm.template.basic
          entries:
          - schema: olm.package
            name: rbln-npu-operator
            defaultChannel: stable
          - schema: olm.channel
            name: candidate
            package: rbln-npu-operator
            entries: []
          - schema: olm.channel
            name: fast
            package: rbln-npu-operator
            entries: []
          - schema: olm.channel
            name: stable
            package: rbln-npu-operator
            entries: []
          SKELETON
              NEW_TEMPLATES+=("$TPL")
              echo "Created skeleton template ${TPL} (this OCP is new)"
            fi
          done

          # Clean-break policy: the first FBC PR does not bridge from pre-FBC
          # bundles (0.0.1..0.4.0) via `replaces`. The new FBC catalog tracks
          # v0.4.x onwards only; subsequent releases auto-chain via PREV_PER_OCP.
          # Releases go GA in version order (a minor from main, a patch from the
          # newest GA only — the kit's cut-release refuses anything else), so
          # the chain is always linear: the newest version replaces the current
          # head.
          {
            echo '---'
            echo 'catalog_templates:'
            for ocp in "${OCP_MINORS[@]}"; do
              prev="${PREV_PER_OCP[$ocp]:-}"
              echo "  - template_name: ${ocp}.yaml"
              echo "    channels: [stable]"
              if [ -n "$prev" ]; then
                echo "    replaces: ${prev}"
              fi
              echo "  - template_name: ${ocp}.yaml"
              echo "    channels: [candidate, fast]"
              if [ -n "$prev" ]; then
                echo "    replaces: ${prev}"
              fi
            done
          } > "${DEST}/release-config.yaml"

          # Configure git
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push to fork
          git add "${DEST}" operators/rbln-npu-operator/ci.yaml
          if [ "${#NEW_TEMPLATES[@]}" -gt 0 ]; then
            git add "${NEW_TEMPLATES[@]}"
          fi
          git commit -m "operator rbln-npu-operator (${VERSION})"
          git push origin "${BRANCH}"

          # Cross-repo PR: fork → upstream
          FORK_OWNER="${FORK%%/*}"
          PR_URL=$(gh pr create \
            --repo redhat-openshift-ecosystem/certified-operators \
            --head "${FORK_OWNER}:${BRANCH}" \
            --base main \
            --title "operator rbln-npu-operator (${VERSION})" \
            --body "Automated OLM bundle submission for rbln-npu-operator ${TAG}")
          echo "$PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

  # Gated on the tag name for the same reason as rc-notify. The kit already
  # deleted the backport label (ga-finish runs with notify off as well).
  ga-notify:
    name: GA summary -> Slack
    needs: [release, olm-bundle]
    if: always() && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release kit (slack-notify.sh)
        uses: actions/checkout@v4
        with:
          repository: RBLN-SW/cloud-component-release-kit
          ref: v1
          path: .release-kit
      - env:
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CLOUD_COMPONENT_SLACK_CHANNEL_ID }}
          R_KIT: ${{ needs.release.result }}
          R_OLM: ${{ needs.olm-bundle.result }}
          PR_URL: ${{ needs.olm-bundle.outputs.pr_url }}
          DRAFT_URL: ${{ needs.release.outputs.draft_url }}
          LAST_RC: ${{ needs.release.outputs.last_rc }}
          LATEST: ${{ needs.release.outputs.latest }}
        run: |
          mark() { case "$1" in success) echo ":white_check_mark:";; failure) echo ":x:";; cancelled) echo ":no_entry_sign:";; skipped) echo ":fast_forward:";; *) echo ":grey_question:";; esac; }
          color=good
          for r in "$R_KIT" "$R_OLM"; do
            case $r in failure|cancelled) color=danger;; esac
          done
          branch="release-${GITHUB_REF_NAME#v}"
          tags="\`$GITHUB_REF_NAME\`"; [ "$LATEST" = true ] && tags="$tags, \`latest\`"
          rows="$(mark "$R_KIT") Images promoted from \`${LAST_RC:-the newest rc}\` by digest → \`$DOCKERHUB_REGISTRY\` ($tags), Helm chart \`${GITHUB_REF_NAME#v}\` → docker.io OCI, release notes drafted, \`backport $branch\` label removed
          $(mark "$R_OLM") certified-operators bundle PR"
          links=()
          [ -n "$DRAFT_URL" ] && links+=(--link "$DRAFT_URL|draft release")
          [ -n "$PR_URL" ] && links+=(--link "$PR_URL|certified-operators PR")
          .release-kit/scripts/slack-notify.sh --color "$color" ${links[@]+"${links[@]}"} --details "$rows" \
            --title ":rocket: *${GITHUB_REPOSITORY#*/}* · *$GITHUB_REF_NAME* · GA" \
            "*Release manager:* review and publish the draft, then watch the certified-operators PR (\`/re-trigger\` if its pipeline fails)."
