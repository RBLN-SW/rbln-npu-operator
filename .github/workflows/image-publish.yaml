name: Publish Multi-Arch Image

# Builds amd64+arm64 in one buildx invocation and pushes a single merged tag.
# Unlike the operator image (Go compilation, native per-arch runners + manifest
# merge), the images published here have no compile step, so QEMU emulation is
# effectively free and the single invocation also guarantees a uniform
# media-type index (a mixed schema2/OCI index breaks oc-mirror --preserve-digests).

on:
  workflow_call:
    inputs:
      image:
        description: "Image repository under the registry (e.g. rbln-node-reboot)"
        required: true
        type: string
      make-target:
        description: "Makefile target that builds the image"
        required: true
        type: string
      version-var:
        description: "Makefile variable holding the image tag"
        required: true
        type: string
      version:
        description: "Image tag to publish (e.g. v1.0.1)"
        required: true
        type: string
      registry:
        description: "Container image registry"
        required: false
        default: 'docker.io/rebellions'
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: build and push (${{ inputs.image }}:${{ inputs.version }})
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.version }}
    steps:
      # The Makefile's version variables default to `latest`; requiring a
      # vX.Y.Z shape here keeps a typoed dispatch from publishing junk tags.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid version '${VERSION}' (expected vX.Y.Z or vX.Y.Z-<suffix>)"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract registry host
        id: registry
        run: |
          REGISTRY="${{ inputs.registry }}"
          echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The release pipeline resolves published tags to digests for the OLM
      # bundle; re-pushing an existing tag would silently change the digest
      # under an already-shipped release.
      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::${IMAGE} already exists — bump the version instead of re-pushing a published tag."
            exit 1
          fi

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          make ${{ inputs.make-target }} \
            BUILD_MULTI_PLATFORM=true PUSH_ON_BUILD=true \
            REGISTRY="${{ inputs.registry }}" \
            ${{ inputs.version-var }}="$VERSION"

      - name: Verify both platforms are present
        run: |
          docker buildx imagetools inspect "$IMAGE" | tee inspect.out
          for p in linux/amd64 linux/arm64; do
            grep -q "$p" inspect.out || { echo "::error::${IMAGE} is missing ${p}"; exit 1; }
          done
