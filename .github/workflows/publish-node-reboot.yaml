name: Publish node-reboot Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: read

# Serialize publishes so the overwrite guard in image-publish.yaml cannot race
# a concurrent dispatch of the same image.
concurrency:
  group: publish-node-reboot

jobs:
  publish:
    uses: ./.github/workflows/image-publish.yaml
    with:
      image: rbln-node-reboot
      make-target: build-node-reboot-image
      version-var: NODE_REBOOT_VERSION
      version: ${{ inputs.version }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
