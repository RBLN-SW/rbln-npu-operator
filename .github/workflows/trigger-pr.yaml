name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  pr-title-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            .*
          requireScope: false
          subjectPattern: ^.{1,100}$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests-check:
    needs: pr-title-validation
    uses: ./.github/workflows/manifests-check.yaml
  code-check:
    needs: pr-title-validation
    uses: ./.github/workflows/go-checks.yaml
  go-tests:
    needs: pr-title-validation
    uses: ./.github/workflows/go-tests.yaml
  go-build:
    needs: pr-title-validation
    uses: ./.github/workflows/go-build.yaml
  image-build:
    needs: [manifests-check, code-check, go-tests, go-build]
    uses: ./.github/workflows/image-build.yaml
    with:
      push-on-build: 'true'
      registry: harbor.k8s.rebellions.in/rebellions
      runner: rbln-sw-k8s-general
    secrets:
      REGISTRY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  e2e-tests:
    needs: [image-build]
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: "ubuntu:24.04"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install make
        run: |
          apt-get update
          apt-get install -y make ca-certificates
          update-ca-certificates
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Restore kubeconfig for e2e tests
        env:
          KUBECONFIG_B64: ${{ secrets.E2E_KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "E2E_KUBECONFIG_B64 secret is not configured" >&2
            exit 1
          fi
          KUBECONFIG_PATH="$RUNNER_TEMP/e2e-kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> $GITHUB_ENV
      - name: Run e2e tests
        env:
          KUBE_CONTEXT: ${{ secrets.E2E_KUBE_CONTEXT }}
          OPERATOR_REGISTRY: harbor.k8s.rebellions.in
          OPERATOR_REPOSITORY: rebellions/rbln-npu-operator
          OPERATOR_VERSION: ${{ needs.image-build.outputs.operator-image-tag }}
          PYPI_USERNAME: ${{ secrets.E2E_PYPI_USERNAME }}
          PYPI_PASSWORD: ${{ secrets.E2E_PYPI_PASSWORD }}
          E2E_CONTAINER_REGISTRY_USER: ${{ secrets.E2E_CONTAINER_REGISTRY_USER }}
          E2E_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.E2E_CONTAINER_REGISTRY_PASSWORD }}
          VALIDATOR_REGISTRY: harbor.k8s.rebellions.in
          VALIDATOR_REPOSITORY: rebellions/rbln-npu-operator-validator
          VALIDATOR_VERSION: ${{ needs.image-build.outputs.operator-image-tag }}
        run: |
          make -C test/e2e e2e-test
  cleanup-images:
    needs: [image-build, e2e-tests]
    if: always()
    runs-on: rbln-sw-k8s-general
    env:
      OPERATOR_IMAGE: harbor.k8s.rebellions.in/rebellions/rbln-npu-operator
      VALIDATOR_IMAGE: harbor.k8s.rebellions.in/rebellions/rbln-npu-operator-validator
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: harbor.k8s.rebellions.in
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Install regctl
        run: |
          REGCTL_VERSION=$(grep '^REGCTL_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ?')
          curl -sSL "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" -o /tmp/regctl
          sudo install /tmp/regctl /usr/local/bin/regctl
      - name: Cleanup operator image tag
        env:
          OPERATOR_IMAGE_TAG: ${{ needs.image-build.outputs.operator-image-tag }}
        run: |
          regctl tag delete "${OPERATOR_IMAGE}:${OPERATOR_IMAGE_TAG}" || true
          regctl tag delete "${VALIDATOR_IMAGE}:${OPERATOR_IMAGE_TAG}" || true
