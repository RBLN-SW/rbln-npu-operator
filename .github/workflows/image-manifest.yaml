name: Create Multi-Arch Manifest

on:
  workflow_call:
    inputs:
      image-tag:
        description: "The final manifest tag (e.g. latest, v1.0.0)"
        required: true
        type: string
      registry:
        description: "Container image registry"
        required: false
        default: 'docker.io/rebellions'
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      operator-image-tag:
        description: "The final multi-arch manifest tag"
        value: ${{ jobs.create-manifest.outputs.image-tag }}

jobs:
  create-manifest:
    name: create multi-arch manifest
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ inputs.image-tag }}
    env:
      OPERATOR_IMAGE: ${{ inputs.registry }}/rbln-npu-operator
      VALIDATOR_IMAGE: ${{ inputs.registry }}/rbln-npu-operator-validator
    steps:
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract registry host
        id: registry
        run: |
          REGISTRY="${{ inputs.registry }}"
          echo "host=${REGISTRY%%/*}" >> $GITHUB_OUTPUT
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Create operator manifest
        run: |
          docker buildx imagetools create \
            --tag "${OPERATOR_IMAGE}:${{ inputs.image-tag }}" \
            "${OPERATOR_IMAGE}:${{ inputs.image-tag }}-amd64" \
            "${OPERATOR_IMAGE}:${{ inputs.image-tag }}-arm64"
      - name: Create validator manifest
        run: |
          docker buildx imagetools create \
            --tag "${VALIDATOR_IMAGE}:${{ inputs.image-tag }}" \
            "${VALIDATOR_IMAGE}:${{ inputs.image-tag }}-amd64" \
            "${VALIDATOR_IMAGE}:${{ inputs.image-tag }}-arm64"
      - name: Verify manifests
        run: |
          docker buildx imagetools inspect "${OPERATOR_IMAGE}:${{ inputs.image-tag }}"
          docker buildx imagetools inspect "${VALIDATOR_IMAGE}:${{ inputs.image-tag }}"
