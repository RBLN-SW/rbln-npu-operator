name: NPU Operator Image Build

on:
  workflow_call:
    inputs:
      push-on-build:
        description: "Whether to push image after build"
        required: false
        default: 'false'
        type: string
      image-tag:
        description: "Image tag to use instead of short SHA (optional)"
        required: false
        default: ''
        type: string
      platform:
        description: "Target platform (e.g. linux/amd64, linux/arm64)"
        required: false
        default: 'linux/amd64'
        type: string
      runner:
        description: "GitHub Actions runner label"
        required: false
        default: 'ubuntu-latest'
        type: string
      registry:
        description: "Container image registry"
        required: false
        default: 'docker.io/rebellions'
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_PASSWORD:
        required: false
    outputs:
      operator-version:
        description: "Short commit SHA"
        value: ${{ jobs.build-image.outputs.operator-version }}
      operator-image-tag:
        description: "Full operator image tag (including architecture suffix)"
        value: ${{ jobs.build-image.outputs.operator-image-tag }}

jobs:
  build-image:
    name: build image (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    outputs:
      operator-version: ${{ steps.build_vars.outputs.commit_short_sha }}
      operator-image-tag: ${{ steps.build_vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - name: Install prerequisites
        run: |
          if ! command -v docker &>/dev/null; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
            sudo chmod 666 /var/run/docker.sock
          fi
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi
      - name: Define build variables
        id: build_vars
        run: |
          COMMIT_SHORT_SHA=${GITHUB_SHA:0:8}
          INPUT_TAG="${{ inputs.image-tag }}"
          ARCH="${{ inputs.platform }}"
          ARCH_SUFFIX="${ARCH#linux/}"

          if [ -n "${INPUT_TAG}" ]; then
            IMAGE_TAG="${INPUT_TAG}-${ARCH_SUFFIX}"
          else
            IMAGE_TAG="${COMMIT_SHORT_SHA}-${ARCH_SUFFIX}"
          fi

          echo "PUSH_ON_BUILD=${{ inputs.push-on-build }}" >> $GITHUB_ENV

          REGISTRY="${{ inputs.registry }}"
          echo "registry_host=${REGISTRY%%/*}" >> $GITHUB_OUTPUT
          {
            echo "commit_short_sha=${COMMIT_SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
          } >> $GITHUB_OUTPUT
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.build_vars.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to Docker Hub for base-image pulls
        if: ${{ steps.build_vars.outputs.registry_host != 'docker.io' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build NPU operator image
        env:
          VERSION: ${{ steps.build_vars.outputs.image_tag }}
          REGISTRY: ${{ inputs.registry }}
          PUSH_ON_BUILD: ${{ env.PUSH_ON_BUILD }}
          PLATFORM: ${{ inputs.platform }}
        run: make build-image
      - name: Build validator image
        env:
          VERSION: ${{ steps.build_vars.outputs.image_tag }}
          REGISTRY: ${{ inputs.registry }}
          PUSH_ON_BUILD: ${{ env.PUSH_ON_BUILD }}
          PLATFORM: ${{ inputs.platform }}
        run: make build-image IMAGE_NAME=${{ inputs.registry }}/rbln-npu-operator-validator
