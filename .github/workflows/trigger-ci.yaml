name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  manifests-check:
    uses: ./.github/workflows/manifests-check.yaml
  code-check:
    uses: ./.github/workflows/go-checks.yaml
  go-tests:
    uses: ./.github/workflows/go-tests.yaml
  go-build:
    uses: ./.github/workflows/go-build.yaml
  dev-image:
    needs: [manifests-check, code-check, go-tests, go-build]
    runs-on: rbln-sw-k8s-general
    env:
      REGISTRY: harbor.k8s.rebellions.in/rebellions
      OPERATOR_IMAGE: harbor.k8s.rebellions.in/rebellions/rbln-npu-operator
      VALIDATOR_IMAGE: harbor.k8s.rebellions.in/rebellions/rbln-npu-operator-validator
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: ./.github/actions/setup-go
        name: Setup Go
      - name: Install prerequisites
        run: |
          if ! command -v docker &>/dev/null; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER"
            sudo chmod 666 /var/run/docker.sock
          fi
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y make
          fi
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.k8s.rebellions.in
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Login to Docker Hub for base-image pulls
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push operator image
        env:
          VERSION: ${{ github.sha }}
          PUSH_ON_BUILD: 'true'
          PLATFORM: linux/amd64
        run: make build-image
      - name: Build and push validator image
        env:
          VERSION: ${{ github.sha }}
          PUSH_ON_BUILD: 'true'
          PLATFORM: linux/amd64
        run: make build-image IMAGE_NAME="$VALIDATOR_IMAGE"
      - name: Tag dev (alias of the immutable commit SHA)
        run: |
          docker buildx imagetools create --tag "${OPERATOR_IMAGE}:dev" "${OPERATOR_IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools create --tag "${VALIDATOR_IMAGE}:dev" "${VALIDATOR_IMAGE}:${GITHUB_SHA}"
      - name: Install regctl and yq
        run: |
          REGCTL_VERSION=$(grep '^REGCTL_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ?')
          sudo curl -sSL "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" \
            -o /usr/local/bin/regctl
          sudo chmod +x /usr/local/bin/regctl

          sudo curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Resolve and pin RELATED_IMAGE digests (dev)
        env:
          VALUES_FILE: deployments/rbln-npu-operator/values.yaml
        run: |
          resolve() {
            local path="$1"
            local registry=$(yq "${path}.registry" "$VALUES_FILE")
            local repository=$(yq "${path}.repository" "$VALUES_FILE")
            local tag=$(yq "${path}.tag" "$VALUES_FILE")
            local image="${registry}/${repository}:${tag}"
            local digest=$(regctl image digest "${image}")
            echo "${image}@${digest}"
          }

          export OPERATOR_DIGEST="${OPERATOR_IMAGE}:${GITHUB_SHA}@$(regctl image digest "${OPERATOR_IMAGE}:${GITHUB_SHA}")"
          export VALIDATOR_DIGEST="${VALIDATOR_IMAGE}:${GITHUB_SHA}@$(regctl image digest "${VALIDATOR_IMAGE}:${GITHUB_SHA}")"
          export DEVICE_PLUGIN_DIGEST=$(resolve .devicePlugin.image)
          export METRICS_EXPORTER_DIGEST=$(resolve .metricsExporter.image)
          export NPU_FEATURE_DISCOVERY_DIGEST=$(resolve .npuFeatureDiscovery.image)
          export VFIO_MANAGER_DIGEST=$(resolve .vfioManager.image)
          export CONTAINER_TOOLKIT_DIGEST=$(resolve .containerToolkit.image)
          export DRA_KUBELET_PLUGIN_DIGEST=$(resolve .draKubeletPlugin.image)
          export SANDBOX_DEVICE_PLUGIN_DIGEST=$(resolve .sandboxDevicePlugin.image)
          export DRIVER_MANAGER_DIGEST=$(resolve .driver.manager.image)

          FILE=config/manager/manager.yaml
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_OPERATOR")).value = env(OPERATOR_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_OPERATOR_VALIDATOR")).value = env(VALIDATOR_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_K8S_DEVICE_PLUGIN")).value = env(DEVICE_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_METRICS_EXPORTER")).value = env(METRICS_EXPORTER_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_NPU_FEATURE_DISCOVERY")).value = env(NPU_FEATURE_DISCOVERY_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_VFIO_MANAGER")).value = env(VFIO_MANAGER_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_RBLN_CONTAINER_TOOLKIT")).value = env(CONTAINER_TOOLKIT_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_DRA_KUBELET_PLUGIN")).value = env(DRA_KUBELET_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_SANDBOX_DEVICE_PLUGIN")).value = env(SANDBOX_DEVICE_PLUGIN_DIGEST)' "$FILE"
          yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "RELATED_IMAGE_DRIVER_MANAGER")).value = env(DRIVER_MANAGER_DIGEST)' "$FILE"
      - name: Build and push OLM bundle + catalog (dev)
        env:
          VERSION: v0.0.0-dev
          BUNDLE_IMAGE: ${{ env.REGISTRY }}/rbln-npu-operator-bundle:dev
          CATALOG_IMAGE: ${{ env.REGISTRY }}/rbln-npu-operator-catalog:dev
          PUSH_ON_BUILD: 'true'
          PLATFORM: linux/amd64
        run: |
          # Bundle pins the immutable commit-SHA operator image; operands stay CR-driven.
          make bundle VERSION="$VERSION" IMAGE="${OPERATOR_IMAGE}:${GITHUB_SHA}" USE_IMAGE_DIGESTS=false
          make build-bundle-image
          # Render the FBC from the just-pushed bundle, then build + push the catalog image.
          make catalog
          make catalog-build-image
      # helm resolves OCI chart tags as SemVer and drops the rest, so the moving
      # dev chart is 0.0.0-dev, not dev. appVersion = commit SHA: the chart's
      # operator/validator tags are empty and fall back to it, so the dev chart
      # resolves the immutable images pushed above; operands keep the
      # values.yaml tags, exactly as the dev bundle does.
      - uses: azure/setup-helm@v5
      - name: Package and push Helm chart (dev)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          export HARBOR_HOST="${REGISTRY%%/*}"
          yq -i '.operator.image.registry = env(HARBOR_HOST) | .validator.image.registry = env(HARBOR_HOST)' \
            deployments/rbln-npu-operator/values.yaml
          echo "$HARBOR_PASSWORD" | helm registry login "$HARBOR_HOST" -u "$HARBOR_USERNAME" --password-stdin
          make helm-push-oci HELM_REGISTRY="oci://$REGISTRY" \
            CHART_VERSION=0.0.0-dev CHART_APP_VERSION="$GITHUB_SHA"
          echo "chart: oci://$REGISTRY/rbln-npu-operator-chart:0.0.0-dev (appVersion $GITHUB_SHA)"
