# Read access for the image pull secrets used by the driver image
# existence check (internal/driver/components/driver_manager.go
# fetchPullSecrets). Deliberately namespaced and get-only: the check reads
# named secrets directly via an uncached APIReader, so it never needs
# list/watch, and must never be widened to a ClusterRole -- that would grant
# cluster-wide secret access this component has no reason to hold.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: rbln-npu-operator
    app.kubernetes.io/managed-by: kustomize
  name: secret-reader-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
