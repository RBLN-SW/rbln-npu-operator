apiVersion: rebellions.ai/v1alpha1
kind: RBLNDriver
metadata:
  labels:
    app.kubernetes.io/name: rbln-npu-operator
  name: rbln-driver
spec:
  registry: repo.rebellions.ai
  image: rebellions/rbln-driver
  version: "3.2.2"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
  - drivercred
  # nodeSelector:
  #   rebellions.ai/npu.deploy.driver: "true"
  # tolerations:
  # - key: node-role.kubernetes.io/control-plane
  #   operator: Exists
  #   effect: NoSchedule
  # annotations:
  #   example.com/owner: "rebellions"
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 250m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # env:
  # - name: RBLN_DRIVER_LOG_LEVEL
  #   value: info
  manager:
    registry: docker.io
    image: rebellions/rbln-k8s-driver-manager
    version: v0.2.1
    imagePullPolicy: IfNotPresent
    # imagePullSecrets:
    # - my-registry-secret
