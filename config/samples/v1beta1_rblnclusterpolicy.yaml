apiVersion: rebellions.ai/v1beta1
kind: RBLNClusterPolicy
metadata:
  labels:
    app.kubernetes.io/name: rbln-npu-operator
  name: rbln-cluster-policy
spec:
  workloadType: container
  # podDefaults applies to all DaemonSet pods managed by this policy.
  # podDefaults:
  #   labels: {}
  #   annotations: {}
  #   tolerations:
  #   - key: node-role.kubernetes.io/control-plane
  #     operator: Exists
  #     effect: NoSchedule
  #   priorityClassName: system-node-critical
  driver:
    upgradePolicy:
      autoUpgrade: false
      maxParallelUpgrades: 1
      waitForCompletion:
        timeoutSeconds: 0
      podDeletion:
        force: false
        timeoutSeconds: 300
      drain:
        enable: false
        force: false
        deleteEmptyDirData: false
        timeoutSeconds: 300
      reboot:
        enable: false
        rebootTimeoutSeconds: 0
        image:
          registry: docker.io
          image: rebellions/rbln-node-reboot
          version: v1.0.0@sha256:429fb4af61dfdf808bf6da3bc89513ef6934f3a5992ed8826216a52095e67788
  devicePlugin:
    enabled: true
    registry: docker.io
    image: rebellions/k8s-device-plugin
    version: v0.4.2@sha256:85ba52ca521deffa63e24c6f7f50fe9b891bc994398b25781485094cb041bfe4
    imagePullPolicy: IfNotPresent
    useGenericResourceName: true
  draKubeletPlugin:
    enabled: false
    registry: docker.io
    image: rebellions/k8s-dra-driver-npu
    version: v0.1.2@sha256:a132091e93e55b74d39a978d83b8866268a4a662288151eafab17c61042c03f6
    imagePullPolicy: IfNotPresent
    driverName: npu.rebellions.ai
    kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
    kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
    healthcheckPort: 51515
  metricsExporter:
    enabled: true
    registry: docker.io
    image: rebellions/rbln-metrics-exporter
    version: v0.3.1@sha256:14d7ac9700e506463ae17ff4ec7c34cb6662dac02c5ed3e40777b2d0f3a64a2b
    imagePullPolicy: IfNotPresent
  npuFeatureDiscovery:
    enabled: true
    registry: docker.io
    image: rebellions/rbln-npu-feature-discovery
    version: v0.2.1@sha256:f9a31fa0bde0072230565bf7fc0e27bdb1904321db2395dc366f5954f156c0e1
    imagePullPolicy: IfNotPresent
  containerToolkit:
    enabled: true
    registry: docker.io
    image: rebellions/rbln-container-toolkit
    version: v0.2.3@sha256:49e1300d034a130a7d2a421c60aa8dd3e878f94520c810c5db69a04ea0bb4e09
    imagePullPolicy: IfNotPresent
  rblnDaemon:
    enabled: false
    registry: repo.rebellions.ai
    image: rebellions/rbln-daemon
    version: "3.2.2@sha256:6a55de6beaf391ee6d0247b5444d055a0b170e76c93998f92452d3b77e63b686"
    imagePullPolicy: IfNotPresent
    hostPort: 50051
    imagePullSecrets:
    - drivercred
  sandboxDevicePlugin:
    enabled: false
    registry: docker.io
    image: rebellions/sandbox-device-plugin
    version: v0.1.0@sha256:9cdd4000438025e7bbcff5c6b021eba0ae9f565a4ab7af4e6c1f43849f7820f2
    imagePullPolicy: IfNotPresent
  vfioManager:
    enabled: false
    registry: docker.io
    image: rebellions/rbln-vfio-manager
    version: v1.0.0@sha256:f468876573e8ba6d726bc6443314d2ae039b3b341fb6de4623fd40cfc53772b5
    imagePullPolicy: IfNotPresent
    driverManager:
      registry: docker.io
      image: rebellions/rbln-k8s-driver-manager
      version: v0.2.1@sha256:b3ac7c05de270adc3adac0c6330c5c20a7676447bd6aaae52d97f588f7b0b39d
      imagePullPolicy: IfNotPresent
  validator:
    registry: docker.io
    image: rebellions/rbln-npu-operator-validator
    version: v0.4.3@sha256:242801b1af68d89550918eccb460eecb2591622449e28342f044327e49675672
    imagePullPolicy: IfNotPresent
