apiVersion: rebellions.ai/v1beta1
kind: RBLNClusterPolicy
metadata:
  labels:
    app.kubernetes.io/name: rbln-npu-operator
  name: rbln-cluster-policy
spec:
  # In a direct CR, updateStrategy: null leaves the strategy unmanaged.
  # Unlike {} in Helm values, {} here explicitly selects RollingUpdate defaults.
  # Driver and SMD retain OnDelete and use driver.upgradePolicy instead.
  workloadType: container
  rds:
    enabled: false
    # deviceSelection: per-node RDS bind allowlist. Omit → auto opt-out on every
    # rds.present node. BDFs are node-specific PCI addresses.
    # deviceSelection:
    #   - nodeName: npu-worker01
    #     targetBDFs:
    #       - "0000:d8:00.0"
  # podDefaults applies to all DaemonSet pods managed by this policy.
  # podDefaults:
  #   labels: {}
  #   annotations: {}
  #   tolerations:
  #   - key: node-role.kubernetes.io/control-plane
  #     operator: Exists
  #     effect: NoSchedule
  #   priorityClassName: system-node-critical
  driver:
    upgradePolicy:
      autoUpgrade: false
      maxParallelUpgrades: 1
      waitForCompletion:
        timeoutSeconds: 0
      podDeletion:
        force: false
        timeoutSeconds: 300
        deleteEmptyDirData: false
  devicePlugin:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: true
    registry: docker.io
    image: rebellions/k8s-device-plugin
    version: v0.5.0
    imagePullPolicy: IfNotPresent
    useGenericResourceName: true
  draKubeletPlugin:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: false
    registry: docker.io
    image: rebellions/k8s-dra-driver-npu
    version: v0.2.1
    imagePullPolicy: IfNotPresent
    driverName: npu.rebellions.ai
    kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
    kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
    healthcheckPort: 51515
  partitionManager:
    enabled: false
    registry: docker.io
    image: rebellions/k8s-partition-manager
    version: v0.1.0
    imagePullPolicy: IfNotPresent
  metricsExporter:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: true
    registry: docker.io
    image: rebellions/rbln-metrics-exporter
    version: v0.4.0
    imagePullPolicy: IfNotPresent
  npuFeatureDiscovery:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: true
    registry: docker.io
    image: rebellions/rbln-npu-feature-discovery
    version: v0.2.3
    imagePullPolicy: IfNotPresent
  containerToolkit:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: true
    registry: docker.io
    image: rebellions/rbln-container-toolkit
    version: v0.2.6
    imagePullPolicy: IfNotPresent
  sandboxDevicePlugin:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: false
    registry: docker.io
    image: rebellions/sandbox-device-plugin
    version: v0.1.1
    imagePullPolicy: IfNotPresent
  vfioManager:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    enabled: false
    registry: docker.io
    image: rebellions/rbln-vfio-manager
    version: v1.0.1
    imagePullPolicy: IfNotPresent
    driverManager:
      registry: docker.io
      image: rebellions/rbln-k8s-driver-manager
      version: v0.3.0
      imagePullPolicy: IfNotPresent
  validator:
    # Leave null to preserve the existing strategy. New DaemonSets default to
    # RollingUpdate with maxUnavailable: 1 and maxSurge: 0.
    # Replace updateStrategy: null with one of these examples to configure it.
    # Automatic rolling updates:
    # updateStrategy:
    #   type: RollingUpdate
    #   rollingUpdate:
    #     maxUnavailable: 1  # Positive integer or a quoted percentage, e.g. "10%".
    # Manual pod replacement (omit rollingUpdate):
    # updateStrategy:
    #   type: OnDelete
    updateStrategy: null
    # Standalone sample uses Docker Hub latest. `make bundle` aligns images with
    # generated CSV relatedImages, including the dev/RC/GA registry and tag.
    registry: docker.io
    image: rebellions/rbln-npu-operator-validator
    version: latest
    imagePullPolicy: Always
