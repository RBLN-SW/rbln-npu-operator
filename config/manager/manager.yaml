apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: rbln-npu-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: rbln-npu-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /usr/bin/npu-operator
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: Always
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 128Mi
        env:
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: RELATED_IMAGE_RBLN_NPU_OPERATOR
            value: docker.io/rebellions/rbln-npu-operator:v0.4.4@sha256:b1fea463bb506249bc502678de3263a003d418777941bdfe2c8c27085e7f62e7
          - name: RELATED_IMAGE_RBLN_K8S_DEVICE_PLUGIN
            value: docker.io/rebellions/k8s-device-plugin:v0.4.3@sha256:37ea701c1014a8afbb43772538e3f0432eb356a7baaaa66efcc1c41a269902c7
          - name: RELATED_IMAGE_RBLN_METRICS_EXPORTER
            value: docker.io/rebellions/rbln-metrics-exporter:v0.3.4@sha256:cee888d8b6f8f7bcd1ddd0b427a91567ff019c75aba13af1f142c9c6dbaf3c54
          - name: RELATED_IMAGE_RBLN_NPU_FEATURE_DISCOVERY
            value: docker.io/rebellions/rbln-npu-feature-discovery:v0.2.3@sha256:1a6124b0fa8393e6ba47a22e39fc4f27e7c8e7f87fbac9cef0eec9fe4db53c4c
          - name: RELATED_IMAGE_VFIO_MANAGER
            value: docker.io/rebellions/rbln-vfio-manager:v1.0.0@sha256:f468876573e8ba6d726bc6443314d2ae039b3b341fb6de4623fd40cfc53772b5
          - name: RELATED_IMAGE_RBLN_NPU_OPERATOR_VALIDATOR
            value: docker.io/rebellions/rbln-npu-operator-validator:v0.4.4@sha256:a9a11ff93665337630f42f783bb6fc93502c5076926b4096d5c81a9505c80bfc
          - name: RELATED_IMAGE_RBLN_CONTAINER_TOOLKIT
            value: docker.io/rebellions/rbln-container-toolkit:v0.2.3@sha256:49e1300d034a130a7d2a421c60aa8dd3e878f94520c810c5db69a04ea0bb4e09
          - name: RELATED_IMAGE_DRA_KUBELET_PLUGIN
            value: docker.io/rebellions/k8s-dra-driver-npu:v0.1.3@sha256:d63a91579dc0bf4c332e01884a7669e8d3eacd7db55687db520b3bf7252de785
          - name: RELATED_IMAGE_SANDBOX_DEVICE_PLUGIN
            value: docker.io/rebellions/sandbox-device-plugin:v0.1.1@sha256:5504fbc0f61da69c98e6e74de0f6a4feb3771019139a34f3283209a180f1281e
          - name: RELATED_IMAGE_NODE_REBOOT
            value: docker.io/rebellions/rbln-node-reboot:v1.0.0@sha256:429fb4af61dfdf808bf6da3bc89513ef6934f3a5992ed8826216a52095e67788
          - name: RELATED_IMAGE_DRIVER_MANAGER
            value: docker.io/rebellions/rbln-k8s-driver-manager:v0.2.2@sha256:8dafc00eac13a9ac7076f094796e51e1ac538c5cb1de061c1b05fb83350b24af
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
