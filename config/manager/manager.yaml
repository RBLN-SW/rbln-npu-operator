apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: rbln-npu-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: rbln-npu-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /usr/bin/npu-operator
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: Always
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 128Mi
        env:
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: RELATED_IMAGE_RBLN_NPU_OPERATOR
            value: docker.io/rebellions/rbln-npu-operator:v0.4.4@sha256:b1fea463bb506249bc502678de3263a003d418777941bdfe2c8c27085e7f62e7
          - name: RELATED_IMAGE_RBLN_K8S_DEVICE_PLUGIN
            value: docker.io/rebellions/k8s-device-plugin:v0.5.0@sha256:d606b7bc8a1605f4175da66f99e5e20ad96d2442643d0052118f4c4c36e4b5f9
          - name: RELATED_IMAGE_RBLN_METRICS_EXPORTER
            value: docker.io/rebellions/rbln-metrics-exporter:v0.4.0@sha256:e7a18178ececd44c655a8fec9be5efd6c4e4793e09a051b01e59efc9dde7d18d
          - name: RELATED_IMAGE_RBLN_NPU_FEATURE_DISCOVERY
            value: docker.io/rebellions/rbln-npu-feature-discovery:v0.2.3@sha256:1a6124b0fa8393e6ba47a22e39fc4f27e7c8e7f87fbac9cef0eec9fe4db53c4c
          - name: RELATED_IMAGE_VFIO_MANAGER
            value: docker.io/rebellions/rbln-vfio-manager:v1.0.1@sha256:6717eac179ff33bccebf936e7aa93560293f2b439655675734c456cb68d77376
          - name: RELATED_IMAGE_RBLN_NPU_OPERATOR_VALIDATOR
            value: docker.io/rebellions/rbln-npu-operator-validator:v0.4.4@sha256:a9a11ff93665337630f42f783bb6fc93502c5076926b4096d5c81a9505c80bfc
          - name: RELATED_IMAGE_RBLN_CONTAINER_TOOLKIT
            value: docker.io/rebellions/rbln-container-toolkit:v0.2.6@sha256:6a95bd83b3ff256eadb3ece2794c6de4b452457a7bbbe378a7f5e59529e80482
          - name: RELATED_IMAGE_DRA_KUBELET_PLUGIN
            value: docker.io/rebellions/k8s-dra-driver-npu:v0.2.1@sha256:9a47e3d594833df034d33ab76cd7fdaba7270747827dcf21286b89c6b7b1e7fe
          - name: RELATED_IMAGE_SANDBOX_DEVICE_PLUGIN
            value: docker.io/rebellions/sandbox-device-plugin:v0.1.1@sha256:5504fbc0f61da69c98e6e74de0f6a4feb3771019139a34f3283209a180f1281e
          - name: RELATED_IMAGE_DRIVER_MANAGER
            value: docker.io/rebellions/rbln-k8s-driver-manager:v0.3.0@sha256:a8ebc696ba5ff63074d86ed8cef0f857a7fd484cedbbe80968de66712e24d8e1
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
