env:
  RNPM_URL: https://rnpm.k8s.rebellions.in

agents:
  queue: k8s

steps:
  - label: ":package: nightly › upload"
    key: rnpm-bundle-nightly
    secrets:
      RNPM_TOKEN: RNPM_TOKEN
    command: |
      curl -fsSL -H "Authorization: Bearer $$RNPM_TOKEN" \
        "${RNPM_URL}/api/v1/bundles/RBLN-SW/rbln-npu-operator/nightly?run=$${RNPM_RUN:-}" | buildkite-agent pipeline upload
