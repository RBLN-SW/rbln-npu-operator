env:
  PIPER_URL: https://piper.k8s.rebellions.in

agents:
  queue: k8s

steps:
  - label: ":package: nightly › upload"
    key: piper-bundle-nightly
    secrets:
      PIPER_TOKEN: PIPER_TOKEN
    command: |
      curl -fsSL -H "Authorization: Bearer $$PIPER_TOKEN" \
        "${PIPER_URL}/api/v1/bundles/RBLN-SW/rbln-npu-operator/nightly?run=$${PIPER_RUN:-}" | buildkite-agent pipeline upload
